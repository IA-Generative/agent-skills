name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Conformité des SKILL.md
        run: ./install.sh --check
      - name: index.json à jour, version Claude Code à jour, hook des permissions
        run: |
          node scripts/skills-index.mjs --check
          node scripts/claude-plugin.mjs --check
          node --test tests/claude/*.test.mjs
      - name: Installation dans un HOME vierge, deux fois (idempotence)
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude"
          ./install.sh --offline
          ./install.sh --offline | tee second.log
          grep -q ' 0 ajouté(s)' second.log

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installation avec le bash 3.2 de macOS, deux fois (idempotence)
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude"
          /bin/bash ./install.sh --offline
          /bin/bash ./install.sh --offline | tee second.log
          grep -q ' 0 ajouté(s)' second.log
          test -L "$HOME/.claude/skills/repo-init"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, celle livrée avec Windows
    steps:
      - uses: actions/checkout@v4
      - name: Installation depuis le clone, deux fois, puis désinstallation
        run: |
          New-Item -ItemType Directory -Force "$HOME\.claude" | Out-Null
          .\install.ps1 -Offline
          $second = .\install.ps1 -Offline 6>&1 | Out-String
          if ($second -notmatch ' 0 ajoute\(s\)') { throw "pas idempotent : $second" }
          $j = Get-Item "$HOME\.agents\skills\repo-init"
          if ($j.LinkType -ne 'Junction') { throw "jonction attendue, obtenu : $($j.LinkType)" }
          if (-not (Test-Path "$HOME\.claude\skills\repo-init\SKILL.md")) { throw 'skill illisible via la jonction' }
          .\install.ps1 -Uninstall
          if (Test-Path "$HOME\.agents\skills\repo-init") { throw 'desinstallation incomplete' }
          if (-not (Test-Path "skills\repo\repo-init\SKILL.md")) { throw 'la desinstallation a touche au depot' }
      - name: Commande du README, sans clone (amorçage par gh)
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_SKILLS_HOME: ${{ runner.temp }}\agent-skills
        run: |
          & ([scriptblock]::Create((gh api "repos/${{ github.repository }}/contents/install.ps1?ref=${{ github.sha }}" -H "Accept: application/vnd.github.raw" | Out-String)))
          # L'amorçage clone la branche par défaut, dont l'arborescence peut différer de celle de la PR :
          # on vérifie ici le clonage et l'absence d'erreur ; les jonctions sont vérifiées à l'étape précédente.
          if (-not (Test-Path "$env:AGENT_SKILLS_HOME\.git")) { throw 'clone absent' }
